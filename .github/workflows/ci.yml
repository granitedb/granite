name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # rustup reads rust-toolchain.toml and installs the pinned compiler.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install just (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y just

      - name: Install just (macOS)
        if: runner.os == 'macOS'
        run: brew install just

      - name: Check
        run: just check
