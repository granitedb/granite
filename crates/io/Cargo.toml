[package]
name = "granite-io"
description = "Storage, network and time traits, and their backends."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
granite-base.workspace = true

# The io_uring backend (docs/06 section 5). libc is already a dependency of
# io-uring; it gives the open flags and errno values, which differ by
# architecture.
[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7.16"
libc = "0.2"

# The portable backend: libc gives fcntl with F_NOCACHE and F_FULLFSYNC.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
