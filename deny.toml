# cargo-deny policy for every Cargo.lock in the repository: the workspace and
# the gateway. `just deny` runs it; the review rules are in CONTRIBUTING.md.
#
# Injected bugs (T0.1.5), each must make `just deny` fail; revert afterwards
# with `git checkout gateway/`:
#   GPL licence:    cargo add --manifest-path gateway/Cargo.toml binstalk@=0.30.0
#                   fails with: error[rejected]: failed to satisfy license requirements
#   Known advisory: cargo add --manifest-path gateway/Cargo.toml smallvec@=1.6.0
#                   fails with: error[vulnerability] for RUSTSEC-2021-0003

[graph]
all-features = true

[advisories]
# Vulnerabilities, unmaintained and unsound crates fail by default. An entry
# here needs the advisory id and the reason it does not affect Granite.
ignore = []

[licenses]
# Permissive licences compatible with shipping under Apache-2.0. Copyleft
# licences (GPL, LGPL, AGPL, MPL, EPL) are not listed and so are rejected.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    # University of Illinois/NCSA, permissive: LLVM's libFuzzer, bundled by
    # libfuzzer-sys in the fuzz targets only.
    "NCSA",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.93
# The list holds the usual permissive licences, not only those in the tree today.
unused-allowed-license = "allow"

[bans]
# Two major versions of one crate need an entry in `skip` with a reason.
multiple-versions = "deny"
wildcards = "deny"
# Path dependencies between our own unpublished crates carry no version.
allow-wildcard-paths = true
deny = [
    { crate = "openssl", reason = "TLS uses rustls (docs/06 section 5)" },
    { crate = "openssl-sys", reason = "TLS uses rustls (docs/06 section 5)" },
]
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
