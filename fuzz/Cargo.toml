# Coverage-guided fuzz targets, run with cargo-fuzz on a nightly toolchain
# (fuzz/README.md). Not a member of the root workspace, which builds on the
# pinned stable toolchain.
[package]
name = "granite-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
# libFuzzer's driver and its Rust bindings, needed by every target.
libfuzzer-sys = "0.4"
granite-schema = { path = "../crates/schema" }
granite-schemac = { path = "../crates/schemac" }
granite-txn = { path = "../crates/txn" }
granite-base = { path = "../crates/base" }
granite-query = { path = "../crates/query" }

[workspace]

[[bin]]
name = "catalog_decode"
path = "fuzz_targets/catalog_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "schema_compile"
path = "fuzz_targets/schema_compile.rs"
test = false
doc = false
bench = false

[[bin]]
name = "program_compile"
path = "fuzz_targets/program_compile.rs"
test = false
doc = false
bench = false

[[bin]]
name = "program_decode"
path = "fuzz_targets/program_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "program_validate"
path = "fuzz_targets/program_validate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fragment_decode"
path = "fuzz_targets/fragment_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fragment_validate"
path = "fuzz_targets/fragment_validate.rs"
test = false
doc = false
bench = false
