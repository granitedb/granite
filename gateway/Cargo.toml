[package]
name = "granite-gateway"
description = "Read-only SQL gateway for Granite."
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/granitedb/granite"
publish = false

# Not a member of the root workspace: see the root Cargo.toml.
[workspace]

[dependencies]
# The gateway's query engine (decision 0004). Only the SQL front end: file
# formats, compression and the extra function families are left out.
datafusion = { version = "=55.2.0", default-features = false, features = ["sql"] }
granite-client = { path = "../clients/rust" }

[dev-dependencies]
# TableProvider is an async_trait; datafusion does not re-export the macro.
async-trait = "=0.1.92"
# DataFusion executes plans on a tokio runtime; both are already in its tree.
tokio = { version = "=1.54.1", features = ["macros", "rt"] }
