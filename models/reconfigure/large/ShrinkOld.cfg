\* Shrink 0 to 4 to 0, 1, 2 (2 leads the first new view); one view change, in the old configuration.
\* Ops up to the boundary, the smallest bounds the gate allows. Too large to check here (README.md), so
\* `just model` does not run it.
CONSTANTS
    Old <- Before
    New <- After
    RecOp = 1
    CheckpointOps = 2
    MaxOps = 2
    MaxView0 = 1
    MaxView1 = 0
    MaxCrash = 0
SPECIFICATION Spec
INVARIANTS TypeOK OneCommitPerOp CommittedNotLost AckedIsDurable OneConfigurationPerOp RemovedCannotDisturb CheckpointHeld
PROPERTY Handover
CHECK_DEADLOCK FALSE
