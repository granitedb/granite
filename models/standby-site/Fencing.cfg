\* 3 groups; transactions 1 {1, 2} and 2 {2, 3}; one op received but not
\* durable, one crash; promotion at any moment, then new transactions at site
\* B, while site A keeps running at epoch 1.
SPECIFICATION Spec
CONSTANTS
    Groups = {1,2,3}
    Txns = {1,2}
    Parts <- SParts
    Unflushed = 1
    MaxCrashes = 1
    NewWork = TRUE
    Defect = "none"
INVARIANTS
    Inv8
    Fenced
    ApplyIsAState
    PromotedAtTa
    SameTsB
    NewAfterTa
    TypeOK
PROPERTIES
    TaMonotone
CHECK_DEADLOCK TRUE
