\* 3 groups; transactions 1 {1, 2}, 2 {2, 3}, 3 {3, 1}; a standby holds at most
\* one op received but not durable, and crashes once in all; promotion at any
\* moment; no new transactions at site B after it.
SPECIFICATION Spec
CONSTANTS
    Groups = {1,2,3}
    Txns = {1,2,3}
    Parts <- SParts
    Unflushed = 1
    MaxCrashes = 1
    NewWork = FALSE
    Defect = "none"
INVARIANTS
    Inv8
    Fenced
    ApplyIsAState
    PromotedAtTa
    SameTsB
    NewAfterTa
    TypeOK
PROPERTIES
    TaMonotone
CHECK_DEADLOCK TRUE
