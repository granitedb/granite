\* Injected defect: each standby group executes what it has durably received up to its own safe timestamp, as a local standby would, instead of up to Ta.
\* Bounds of StandbySite.cfg; checks the card's properties only.
SPECIFICATION Spec
CONSTANTS
    Groups = {1,2,3}
    Txns = {1,2,3}
    Parts <- SParts
    Unflushed = 1
    MaxCrashes = 1
    NewWork = FALSE
    Defect = "apply_on_arrival"
INVARIANTS
    Inv8
    Fenced
PROPERTIES
    TaMonotone
CHECK_DEADLOCK FALSE
