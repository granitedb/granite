\* 5 replicas, quorums 3 and 3: 1 op, views 0 to 1, one crash.
\* Faults are split between runs: both at once do not fit exhaustive checking here.
CONSTANTS
    N = 5
    Qr = 3
    Qv = 3
    MaxOps = 1
    MaxView = 1
    MaxCrash = 1
    MaxCorrupt = 0
    EagerVotes = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK OneCommitPerOp CommittedNotLost AckedIsDurable
CHECK_DEADLOCK FALSE
