\* 6 replicas, flexible quorums 3 and 4: 1 op, views 0 to 1, message faults only. Slots a
\* new primary lacks are unreadable, so the nack quorum of 4 is exercised; crash and
\* corruption do not fit exhaustive checking at 6 replicas here.
CONSTANTS
    N = 6
    Qr = 3
    Qv = 4
    MaxOps = 1
    MaxView = 1
    MaxCrash = 0
    MaxCorrupt = 0
    EagerVotes = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK OneCommitPerOp CommittedNotLost AckedIsDurable
CHECK_DEADLOCK FALSE
