\* Qr + Qv = N; the quorum assumption of Vsr is replaced so the run can start.
CONSTANTS
    N = 3
    Qr = 1
    Qv = 2
    MaxOps = 1
    MaxView = 1
    MaxCrash = 0
    MaxCorrupt = 0
    EagerVotes = FALSE
    QuorumsSound <- NoQuorumCheck
SPECIFICATION Spec
INVARIANTS OneCommitPerOp CommittedNotLost AckedIsDurable
CHECK_DEADLOCK FALSE
