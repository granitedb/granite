\* 3 groups; transactions 1 (independent), 2 (coordinated) and 3 (independent)
\* with overlapping keys; one view change per group; bypass on.
SPECIFICATION Spec
CONSTANTS
    Groups = {1,2,3}
    Txns = {1,2,3}
    Kind <- SKind
    Keys <- SKeys
    Owner <- SOwner
    Cap <- SCap
    MaxViewChanges = 1
    Bypass = TRUE
    Defect = "none"
INVARIANTS
    TypeOK
    Atomic
    SameTs
    ShardOrder
    Serializable
    NoDeadlock
CHECK_DEADLOCK TRUE
