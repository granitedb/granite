\* 3 groups; transactions 1 (independent), 2 and 4 (coordinated, crossing on
\* groups 2 and 3); one view change per group; bypass on.
SPECIFICATION Spec
CONSTANTS
    Groups = {1,2,3}
    Txns = {1,2,4}
    Kind <- SKind
    Keys <- SKeys
    Owner <- SOwner
    Cap <- SCap
    MaxViewChanges = 1
    Bypass = TRUE
    Defect = "none"
INVARIANTS
    TypeOK
    Atomic
    SameTs
    ShardOrder
    Serializable
    NoDeadlock
CHECK_DEADLOCK TRUE
